<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognifyz - Task 5: API Integration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            background-color: #ffffff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #e67e22;
        }
        p {
            color: #34495e;
            font-size: 18px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #d35400;
        }
        #api-data {
            max-width: 600px;
            margin: 20px auto;
            text-align: left;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>Welcome to My Frontend Internship Task</h1>
    
    <h2>Task 5: API Integration</h2>
    
    <p>Hello! My name is MUTHU RATHI S. Click the button below to fetch live data from an API!</p>
    
    <!-- Button with direct JavaScript function call -->
    <button onclick="fetchUserData()">Fetch Data from API</button>
    
    <br>

    <!-- Container to display API data -->
    <div id="api-data">
        <p style="text-align: center; color: #7f8c8d;">Click the button to load data...</p>
    </div>

    <!-- JavaScript code directly embedded to avoid file loading issues -->
    <script>
        function fetchUserData() {
            const dataContainer = document.getElementById('api-data');
            dataContainer.innerHTML = "<p style='text-align: center; color: #e67e22;'>Loading data...</p>";

            fetch('https://jsonplaceholder.typicode.com/users/1')
                .then(response => response.json())
                .then(data => {
                    dataContainer.innerHTML = `
                        <h3 style="color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px;">User Profile (Fetched via API)</h3>
                        <p><strong>Name:</strong> ${data.name}</p>
                        <p><strong>Username:</strong> ${data.username}</p>
                        <p><strong>Email:</strong> ${data.email}</p>
                        <p><strong>City:</strong> ${data.address.city}</p>
                        <p><strong>Company:</strong> ${data.company.name}</p>
                    `;
                })
                .catch(error => {
                    dataContainer.innerHTML = "<p style='color: red; text-align: center;'>Failed to load data.</p>";
                    console.error('Error:', error);
                });
        }
    </script>

</body>
</html>
